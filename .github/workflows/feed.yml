name: Sanket live feed
# Runs on GitHub's free cloud computers (this repo is public, so the minutes are unlimited), Sunday to Thursday.
# It starts before the NEPSE session, sends live prices until 15:05 Nepal time, then saves the daily close (brokers, analysis).
on:
  schedule:
    - cron: "20 4 * * 0-4"   # 10:05 Nepal time; GitHub can start scheduled jobs hours late, so there are backups (only one runs at a time)
    - cron: "50 4 * * 0-4"
    - cron: "20 5 * * 0-4"
    - cron: "50 5 * * 0-4"
  workflow_dispatch:
concurrency:
  group: sanket-feed
  cancel-in-progress: false
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q git+https://github.com/basic-bgnr/NepseUnofficialApi requests
      - run: python -u feed.py auto
        env:
          NP_API: ${{ secrets.NP_API }}
          NP_KEY: ${{ secrets.NP_KEY }}
          NP_NO_HISTORY: "1"
          NP_EXIT_AFTER_CLOSE: "1"
