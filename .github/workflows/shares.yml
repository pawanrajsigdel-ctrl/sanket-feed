name: Sanket promoter and public shares
# Reads how many shares are promoter shares and how many are public for every company, from the exchange's own company details. Runs every Sunday.
on:
  schedule:
    - cron: "30 6 * * 0"   # about 12:15 Nepal time on Sunday
  workflow_dispatch:
    inputs:
      check:
        description: "Only print what is read for these symbols, e.g. NABIL UPPER (nothing is stored). Leave empty to store all."
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: sanket-shares
  cancel-in-progress: false
jobs:
  shares:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q git+https://github.com/basic-bgnr/NepseUnofficialApi requests
      - run: python -u feed.py shares ${{ github.event.inputs.check }}
        env:
          NP_API: ${{ secrets.NP_API }}
          NP_KEY: ${{ secrets.NP_KEY }}
      - name: Save the records to the repository
        if: ${{ github.event.inputs.dry != 'true' && github.event.inputs.dry != 'dry' && github.event.inputs.check == '' }}
        run: |
          git config user.name "sanket-bot"; git config user.email "sanket-bot@users.noreply.github.com"
          git add -A data
          git diff --staged --quiet && echo "nothing new" && exit 0
          git commit -qm "Records shares $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done; exit 1
