name: Data sources test
# Run by hand (Actions -> Data sources test -> Run workflow). Shows which free sources can give company news, announcements, earnings (EPS), IPO and dividend calendars.
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: What the NEPSE library can fetch beyond prices
        run: |
          pip install -q git+https://github.com/basic-bgnr/NepseUnofficialApi requests
          python - <<'PY'
          import re
          from nepse import Nepse
          n = Nepse(); n.setTLSVerification(False)
          names = [m for m in dir(n) if m.startswith("get") and re.search(r"disclos|news|notice|alert|dividend|ipo|financ|report|event|holiday|supply|debenture|right|bonus|merge", m, re.I)]
          print("Library methods that may help:", names)
          for m in names:
              try:
                  r = getattr(n, m)()
                  s = repr(r)
                  print("OK  ", m, "->", (len(r) if hasattr(r, "__len__") else "?"), "items;", s[:300])
              except TypeError as e:
                  print("NEEDS ARGUMENT", m, "->", str(e)[:120])
              except Exception as e:
                  print("FAIL", m, "->", repr(e)[:160])
          PY
      - name: YoNepse file layout (new paths)
        run: |
          for f in notify/disclosures.json notify/notices.json notify/exchange_messages.json ipo/upcoming.json dividend/history.json company/financials.json company/profiles.json; do
            printf '\n=== %s -> ' "$f"; curl -sS -m 25 -L -o /tmp/y.json -w "HTTP %{http_code}, %{size_download} bytes\n" "https://shubhamnpk.github.io/yonepse/data/$f" || echo unreachable
            python3 - <<'PY'
          import json
          try:
              j = json.load(open("/tmp/y.json"))
          except Exception as e:
              print("not JSON:", e); raise SystemExit
          rows = j if isinstance(j, list) else next((v for v in j.values() if isinstance(v, list)), None) if isinstance(j, dict) else None
          print("top level:", type(j).__name__, (list(j.keys())[:12] if isinstance(j, dict) else ""), "| records:", len(rows) if rows is not None else "-")
          if rows:
              print("fields:", list(rows[0].keys()) if isinstance(rows[0], dict) else rows[0])
              print("sample:", json.dumps(rows[0], ensure_ascii=False)[:500])
          PY
          done
      - name: Page structure (AGM list, company financials)
        run: |
          python3 - <<'PY'
          import re, html, requests
          H = {"User-Agent": "Mozilla/5.0 (compatible; SanketProbe/1.0)"}
          def show(url, words, width=700):
              r = requests.get(url, headers=H, timeout=30)
              print("\n=====", url, r.status_code, len(r.text), "bytes")
              raw = r.text
              urls = sorted(set(re.findall(r"""["'](/[A-Za-z0-9_\-/\.]*(?:agm|ajax|json|list|data|financ|report)[A-Za-z0-9_\-/\.?=&]*)["']""", raw, re.I)))[:25]
              print("script/ajax-looking urls:", urls)
              t = html.unescape(re.sub(r"\s+", " ", re.sub(r"(?s)<[^>]+>", " ", re.sub(r"(?is)<(script|style)[^>]*>.*?</\\1>", " ", raw))))
              for w in words:
                  i = t.find(w)
                  print("--", w, "->", t[max(0, i - 80): i + width] if i >= 0 else "not found")
          show("https://www.sharesansar.com/agm-list", ["AGM Date", "Book Closure"])
          show("https://www.sharesansar.com/company/nabil", ["Quarterly", "Financial", "EPS", "Net Profit"])
          show("https://merolagani.com/CompanyDetail.aspx?symbol=NABIL", ["Quarterly", "Net Profit", "Paid Up"])
          PY
      - name: Outside sources
        run: |
          for u in \
            "https://shubhamnpk.github.io/yonepse/data/proposed_dividend/history_all_years.json" \
            "https://shubhamnpk.github.io/yonepse/data/proposed_dividend/latest_1y.json" \
            "https://www.sharesansar.com/existing-issues" \
            "https://merolagani.com/Floorsheet.aspx" \
            "https://merolagani.com/CompanyDetail.aspx?symbol=NABIL" \
            "https://www.sharesansar.com/company/nabil" \
            "https://news.google.com/rss/search?q=%E0%A4%B6%E0%A5%87%E0%A4%AF%E0%A4%B0&hl=ne&gl=NP&ceid=NP:ne" ; do
            printf '%s -> ' "$u"; curl -sS -m 20 -L -A "Mozilla/5.0" -o /tmp/o.txt -w "HTTP %{http_code}, %{size_download} bytes\n" "$u" || echo "unreachable"
            head -c 300 /tmp/o.txt | tr '\n' ' '; echo; echo
          done
