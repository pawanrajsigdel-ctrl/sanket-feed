name: Sanket company figures
# Reads EPS, P/E, book value, P/B, dividend and bonus for every company (one public page about each second) and stores them. Runs each evening after the close.
on:
  schedule:
    - cron: "20 11 * * 1-5"   # 17:05 Nepal time, Monday to Friday
  workflow_dispatch:
    inputs:
      check:
        description: "Only print what is read for these symbols, e.g. NABIL NICA (nothing is stored). Leave empty to store all."
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: sanket-fundamentals
  cancel-in-progress: false
jobs:
  fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q git+https://github.com/basic-bgnr/NepseUnofficialApi requests
      - run: python -u feed.py fundamentals ${{ github.event.inputs.check }}
        env:
          NP_API: ${{ secrets.NP_API }}
          NP_KEY: ${{ secrets.NP_KEY }}
      - name: Save the records to the repository
        if: ${{ github.event.inputs.dry != 'true' && github.event.inputs.dry != 'dry' && github.event.inputs.check == '' }}
        run: |
          git config user.name "sanket-bot"; git config user.email "sanket-bot@users.noreply.github.com"
          git add -A data
          git diff --staged --quiet && echo "nothing new" && exit 0
          git commit -qm "Records fundamentals $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done; exit 1
