name: Sanket page copies
# Saves the public pages' data as files (data/snap) after every close, so the website reads them from GitHub and the database is not asked for it.
on:
  schedule:
    - cron: "35 10 * * 1-5"   # 16:20 Nepal time, Monday to Friday
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sanket-snap
  cancel-in-progress: false
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests
      - run: python -u snap.py
        env:
          NP_API: ${{ secrets.NP_API }}
      - name: Save to the repository
        run: |
          git config user.name "sanket-bot"; git config user.email "sanket-bot@users.noreply.github.com"
          git add -A data/snap
          git diff --staged --quiet && echo "nothing new" && exit 0
          git commit -qm "Page copies $(date -u +%F)"
          git pull -q --rebase origin main && git push -q origin HEAD:main
