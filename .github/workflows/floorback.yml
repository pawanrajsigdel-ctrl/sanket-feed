name: Sanket floorsheet past days
# Fills in earlier trading days of the floorsheet archive from the open NEPSE floorsheet dataset (NEPSE itself only serves the current day).
# Run it by hand: days = how many missing trading days to add (newest first). Run it again to go further back. Days already saved are skipped.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many past trading days to add (each is about 0.6 MB)"
        required: false
        default: "60"
permissions:
  contents: write
concurrency:
  group: sanket-floorsheet
  cancel-in-progress: false
jobs:
  back:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests git+https://github.com/basic-bgnr/NepseUnofficialApi
      - name: Copy the past days
        run: python -u feed.py floorback ${{ github.event.inputs.days || '60' }}
        env:
          NP_API: ${{ secrets.NP_API }}
          NP_KEY: ${{ secrets.NP_KEY }}
      - name: Save to the repository
        if: always()
        run: |
          git config user.name "sanket-bot"; git config user.email "sanket-bot@users.noreply.github.com"
          git add -A data/floor
          git diff --staged --quiet && echo "nothing new" && exit 0
          git commit -qm "Floorsheet past days $(date -u +%F)"
          git pull -q --rebase origin main && git push -q origin HEAD:main
